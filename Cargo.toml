[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/sim-core",
    "crates/sim-wasm",
    "crates/server",
    "tools/loadtest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The release rust-toolchain.toml pins (and docker/Dockerfile builds with).
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
sim-core = { path = "crates/sim-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package.sim-wasm]
opt-level = "s"
